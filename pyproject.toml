[project]
name = "onos-intent-mcp-doc-context"
version = "1.1.0"
description = "ONOS intent MCP with bounded read-only scenario document context"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "starlette>=0.48",
    "uvicorn>=0.31.1",
]

[project.scripts]
onos-mcp = "onos_mcp.server:main"
onos-mcp-stdlib = "onos_mcp.stdlib_server:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "onos_mcp"
